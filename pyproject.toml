# Modern Python project configuration
# https://packaging.python.org/en/latest/specifications/pyproject-toml/

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataconv"
version = "1.0.0"
description = "Professional data format converter with powerful query language and library API for JSON, YAML, TOML, XML, and CSV"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "thaisya", email = "nikitapetruchekk@gmail.com"}
]
keywords = ["data", "converter", "json", "yaml", "toml", "xml", "cli", "csv", "dataconv"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core dependencies (minimal for library use)
# These are required for basic data conversion and API functionality
dependencies = [
    "lark>=1.1.9",           # Parser generator for query language
    "jsonpath-ng>=1.6.1",    # JSONPath expressions
    "pyyaml>=6.0.1",         # YAML support
    "xmltodict>=0.13.0",     # XML to dict conversion
    "toml>=0.10.2",          # TOML support (for Python < 3.11)
    "orjson>=3.9.0",         # Fast JSON (3x speedup, drop-in replacement)
]

# Optional dependencies
[project.optional-dependencies]

# CLI dependencies - for interactive REPL experience
cli = [
    "rich>=13.7.0",          # Beautiful terminal output, progress bars, tables
]

# Development tools
dev = [
    "pytest>=8.0.0",         # Testing framework
    "pytest-cov>=4.1.0",     # Coverage reporting
    "black>=24.0.0",         # Code formatter
    "ruff>=0.6.0",           # Fast Python linter
    "mypy>=1.11.0",          # Type checker
    "types-PyYAML>=6.0.0",   # Type stubs for PyYAML
    "types-toml>=0.10.0",    # Type stubs for toml
]

# Everything - all optional dependencies
full = [
    "dataconv[cli,dev]",
]

# CLI entry point (only works if 'cli' extras installed)
[project.scripts]
dataconv = "dataconv.main:main"

# Tool configurations
[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
strict_equality = true

# Ignore missing imports for third-party libraries
[[tool.mypy.overrides]]
module = ["jsonpath_ng.*", "xmltodict.*"]
ignore_missing_imports = true

# Package discovery - only include dataconv package
[tool.setuptools.packages.find]
include = ["dataconv*"]
exclude = ["files*", "tests*", "*.tests", "*.tests.*"]




